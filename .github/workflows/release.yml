name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build and Package macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all tags and history so that the dynamic versioning works correctly

      - name: Run build and package script
        run: |
          chmod +x build_and_deploy.sh
          ./build_and_deploy.sh

      - name: Compress application bundle
        run: |
          # Use -y to preserve symlinks in framework directories
          zip -y -r ovcc-macos.zip ovcc.app

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ovcc-macos.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
